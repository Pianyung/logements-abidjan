name: Collecte annonces Abidjan

on:
  schedule:
    # 4x/jour, heure d'Abidjan (UTC+0) : 07h, 12h, 17h, 20h
    - cron: '0 7,12,17,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: pip install -r requirements.txt
      - name: Lancer le collecteur (Facebook via Google)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
        run: python collect.py
      - name: Commit des nouvelles annonces
        run: |
          git config user.name "collecteur-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/listings.json
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "MAJ annonces $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
